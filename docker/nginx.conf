server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 10m;

    # Keamanan: sembunyikan detail & larang akses ke file sensitif.
    server_tokens off;
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/storage/.*\.(php|htaccess|key|pem)$ { deny all; }
    location /storage/keys/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass hub-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;
    }

    # Reverb dilayani sebagai reverse proxy terpisah (lihat service hub-reverb).
    location /app/ {
        proxy_pass http://hub-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
