# HTTP (:80) — redirect everything to HTTPS.
# The :443 block below does the real proxying.
server {
    listen 80;
    server_name _;

    # Keamanan: sembunyikan detail & larang akses ke file sensitif.
    server_tokens off;

    # Redirect all plain-HTTP traffic to HTTPS (307 preserves the method/body,
    # which matters for POST-based API/webhook calls from RME-Backend clients).
    return 307 https://$host$request_uri;
}

# HTTPS (:443) — the real edge: serves the app and reverse-proxies Reverb.
#
# TLS sertifikat di-mount dari volume `hub-tls` (lihat docker-compose.yml) ke
# /etc/nginx/certs/. OPERATOR HARUS menaruh sertifikat asli di sana sebelum
# expose port 443 ke publik — untuk dev/test, generate self-signed dulu:
#   openssl req -x509 -newkey rsa:2048 -nodes \
#       -keyout /path/certs/privkey.pem -out /path/certs/fullchain.pem \
#       -days 365 -subj "/CN=localhost"
# lalu mount direktori tersebut ke volume hub-tls. Tanpa sertifikat, nginx
# gagal start (cert/key file tidak ditemukan).
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Placeholder — ganti dengan path sertifikat asli milik operator.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS hardening (kompatibel dengan client umum).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/public;
    index index.php;

    client_max_body_size 10m;

    # Keamanan: sembunyikan detail & larang akses ke file sensitif.
    server_tokens off;
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/storage/.*\.(php|htaccess|key|pem)$ { deny all; }
    location /storage/keys/ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass hub-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;
    }

    # Reverb dilayani sebagai reverse proxy terpisah (lihat service hub-reverb).
    location /app/ {
        proxy_pass http://hub-reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
