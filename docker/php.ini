; Produksi: matikan display_errors, naikkan batas eksekusi untuk job lisensi.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors = On
expose_php = Off

; Hub memproses token lisensi (base64 payload) — naikkan sedikit dari default.
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 10M

; Session/cookie aman (hub admin login via Sanctum).
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = Lax
