# RME-License-Hub — deployment referensi (single-host, production-grade).
#
# Pola mengikuti docker/loadtest tim (php-fpm + nginx, PHP 8.4) namun untuk
# produksi hub: proses dipisah menjadi app (php-fpm), nginx (edge), reverb
# (websocket), queue worker, dan scheduler. State disimpan di volume MariaDB
# & Redis.
#
# Jalankan:  docker compose up -d --build
# Lihat DEPLOYMENT.md untuk langkah lengkap (RSA keypair, reverb creds, dll).

services:
  # --- Database (MariaDB) ------------------------------------------------
  hub-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-rme_license_hub}
      MARIADB_USER: ${DB_USERNAME:-hub}
      MARIADB_PASSWORD: ${DB_PASSWORD:-hubpassword}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-hubroot}
    volumes:
      - hub-db-data:/var/lib/mysql
    ports:
      # Hanya untuk debugging lokal; di produksi hapus expose ini.
      # Host port 3307 (bukan 3306 default) — hindari bentrok dengan MariaDB
      # host lain yang mungkin sudah jalan di 3306 (mis. RME-Backend saat
      # dev). Container-ke-container tetap lewat hub-db:3306 (hostname
      # internal, tidak terpengaruh port publish ini).
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [hub-net]

  # --- Cache / Queue / Reverb scaling (Redis) ---------------------------
  hub-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - hub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [hub-net]

  # --- Application (PHP-FPM) — dipanggil nginx & sebagai base reverb/queue
  hub-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      # php-fpm mendengarkan 9000; nginx memanggilnya.
      DB_CONNECTION: mysql
      DB_HOST: hub-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rme_license_hub}
      DB_USERNAME: ${DB_USERNAME:-hub}
      DB_PASSWORD: ${DB_PASSWORD:-hubpassword}
      REDIS_HOST: hub-redis
      REDIS_PORT: 6379
      # Proses terpisah berbagi konfigurasi berikut:
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      # Reverb: app container terhubung ke server reverb via hostname service.
      REVERB_HOST: hub-reverb
      REVERB_SERVER_HOST: 0.0.0.0
      # Healthcheck mode selector (see docker/healthcheck.sh).
      HUB_HEALTHCHECK: app
    depends_on:
      hub-db:
        condition: service_healthy
      hub-redis:
        condition: service_healthy
    # Prove php-fpm actually serves the Laravel `/up` route (registered via
    # `health: '/up'` in bootstrap/app.php) via an in-container FastCGI probe
    # (no HTTP server here — hub-nginx is a separate container). Longer
    # start_period than redis/db because Laravel bootstrap + config:cache is
    # slower than a bare fpm socket coming up.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [hub-net]

  # --- Edge: nginx (web + reverse proxy Reverb /app) --------------------
  hub-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # 443 dibuka bila TLS diaktifkan di deployment nyata (lihat DEPLOYMENT.md).
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Sertifikat TLS (mount saat produksi). Dipetakan ke /etc/nginx/certs,
      # sesuai path ssl_certificate/ssl_certificate_key di nginx.conf.
      # Taruh fullchain.pem + privkey.pem di sana (atau mount bind direktori
      # lokal, mis. ./docker/certs:/etc/nginx/certs:ro) sebelum expose 443.
      - hub-tls:/etc/nginx/certs:ro
    depends_on: [hub-app, hub-reverb]
    networks: [hub-net]

  # --- Reverb WebSocket server (proses terpisah) ------------------------
  hub-reverb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: hub-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rme_license_hub}
      DB_USERNAME: ${DB_USERNAME:-hub}
      DB_PASSWORD: ${DB_PASSWORD:-hubpassword}
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: hub-reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_PORT: 8080
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      # Scaling Reverb via Redis (aman untuk multi-instance nanti).
      REVERB_SCALING_ENABLED: "true"
      REDIS_HOST: hub-redis
      REDIS_PORT: 6379
      # Healthcheck mode selector (see docker/healthcheck.sh).
      HUB_HEALTHCHECK: reverb
    expose:
      - "8080"
    depends_on:
      hub-db:
        condition: service_healthy
      hub-redis:
        condition: service_healthy
    # Reverb is a long-running websocket server bound to TCP 8080. Prove the
    # server socket is actually open and accepting connections (not just that
    # the process is alive) via a TCP liveness probe.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [hub-net]

  # --- Queue worker (proses terpisah) -----------------------------------
  hub-queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--queue=default,grup,webhooks", "--tries=3", "--max-time=3600"]
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: hub-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rme_license_hub}
      DB_USERNAME: ${DB_USERNAME:-hub}
      DB_PASSWORD: ${DB_PASSWORD:-hubpassword}
      QUEUE_CONNECTION: redis
      REDIS_HOST: hub-redis
      REDIS_PORT: 6379
      # The queue worker is what actually PUBLISHES GrupNotification to
      # Reverb's REST API (BroadcastEvent job) — without this override it
      # fell back to .env's REVERB_HOST (host-machine dev value, e.g.
      # "localhost"), which is unreachable from inside this container.
      # Found via a real WebSocket end-to-end test, not review.
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: hub-reverb
      # Healthcheck mode selector (see docker/healthcheck.sh).
      HUB_HEALTHCHECK: queue
    depends_on:
      hub-db:
        condition: service_healthy
      hub-redis:
        condition: service_healthy
    # Queue worker runs `php artisan queue:work` — no HTTP server. Verify the
    # worker master process is actually alive (process-alive liveness), which is
    # the simplest correct check for a worker that exposes nothing.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [hub-net]

  # --- Scheduler (proses terpisah, untuk retry webhook/prune) -----------
  hub-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_CONNECTION: mysql
      DB_HOST: hub-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-rme_license_hub}
      DB_USERNAME: ${DB_USERNAME:-hub}
      DB_PASSWORD: ${DB_PASSWORD:-hubpassword}
      REDIS_HOST: hub-redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: hub-reverb
      # Healthcheck mode selector (see docker/healthcheck.sh).
      HUB_HEALTHCHECK: scheduler
    depends_on:
      hub-db:
        condition: service_healthy
      hub-redis:
        condition: service_healthy
    # Scheduler runs `php artisan schedule:work` — a long-lived master loop that
    # fires the Laravel scheduler every minute. Same approach as the queue
    # worker: a process-alive check (no HTTP server), the simplest correct
    # liveness probe for a process that exposes nothing.
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [hub-net]

volumes:
  hub-db-data:
  hub-redis-data:
  hub-tls:

networks:
  hub-net:
    driver: bridge
